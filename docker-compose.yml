# Kafka (KRaft, no ZooKeeper) + Kafka UI + Redis + Airflow (standalone). Spark runs locally in local mode.
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1          # single partition keeps event-time order for the Spark watermark
      KAFKA_LOG_RETENTION_HOURS: 4380
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes: [kafka-data:/var/lib/kafka/data]
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment: {KAFKA_CLUSTERS_0_NAME: local, KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"}
    depends_on: [kafka]
    mem_limit: 512m
  redis:
    image: redis:7-alpine
    container_name: redis
    ports: ["6379:6379"]
    mem_limit: 128m
  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow
    command: standalone
    ports: ["8081:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      REDIS_HOST: redis
      PYTHONPATH: /opt/project
      _PIP_ADDITIONAL_REQUIREMENTS: "redis snowflake-connector-python python-dotenv"
      CARBON_NO_DOTENV: "1"          # use the container's own settings, not the laptop's .env (REDIS_HOST=localhost)
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
    volumes: [".:/opt/project", "airflow-data:/opt/airflow"]
    mem_limit: 2g
volumes: {kafka-data: {}, airflow-data: {}}
